        - text: / Five security habits every school should adopt
      - generic [ref=f56e35]: 16 Oct 2026
      - heading "Five security habits every school should adopt" [level=1] [ref=f56e36]
      - paragraph [ref=f56e37]: From shared logins to lost paper records, student data leaks quietly. Five practical habits that protect learners, staff and families.
      - generic [ref=f56e38]:
        - generic [ref=f56e39]: Security · 2 min read · Kairo CORE team
        - generic [ref=f56e40]:
          - button "Like 2" [ref=f56e41] [cursor=pointer]:
            - generic [ref=f56e44]: Like
            - emphasis [ref=f56e45]: "2"
          - button [ref=f56e46] [cursor=pointer]:
            - generic [ref=f56e52]:
              - text: Share
              - emphasis [ref=f56e53]: "0"
      - img "Five security habits every school should adopt" [ref=f56e55]
      - generic [ref=f56e56]:
        - paragraph [ref=f56e57]: "Schools hold some of the most sensitive records a person will ever have: identity documents, medical notes, grades and family contact details. Protecting them is not only an IT concern — it is a duty of care."
        - heading "1. One account per person" [level=2] [ref=f56e58]
        - paragraph [ref=f56e59]: Shared loggers make accountability impossible. Every staff member should have their own login with permissions scoped to their role — a class teacher does not need the same access as a bursar.
        - heading "2. Least privilege, reviewed often" [level=2] [ref=f56e60]
        - paragraph [ref=f56e61]: Permissions should grow and shrink with real responsibilities. Termly reviews catch accounts that still hold access from a role someone left years ago.
        - heading "3. Prefer systems that log" [level=2] [ref=f56e62]
        - paragraph [ref=f56e63]: A spreadsheet cannot tell you who changed a mark or deleted a receipt. Any platform handling student records should keep an audit trail of who did what and when.
        - heading "4. Verify documents instead of trusting them" [level=2] [ref=f56e64]
        - paragraph [ref=f56e65]:
          - text: Report cards and certificates that carry a public verification code remove the incentive to forge them — and the awkwardness of manual verification. See
          - link "our security overview" [ref=f56e66] [cursor=pointer]:
            - /url: /security
          - text: for how verification works.
        - heading "5. Backups you have actually tested" [level=2] [ref=f56e67]
        - paragraph [ref=f56e68]: A backup you have never restored is a hope, not a plan. Test recovery regularly, and prefer providers who encrypt data in transit and at rest.
        - paragraph [ref=f56e69]:
          - text: Kairo CORE ships with role-based permissions, audit logging and encrypted connections as standard. Read the
          - link "full security practices" [ref=f56e70] [cursor=pointer]:
            - /url: /security
          - text: ", or"
          - link "register your school" [ref=f56e71] [cursor=pointer]:
            - /url: /register
          - text: to get started securely.
