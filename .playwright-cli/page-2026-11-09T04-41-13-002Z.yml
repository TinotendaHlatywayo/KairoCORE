  - main [ref=f51e11]:
    - generic [ref=f51e13]:
      - generic [ref=f51e14]:
        - paragraph [ref=f51e15]: Security & Data Protection
        - heading "Your school’s data, protected by design" [level=1] [ref=f51e16]
        - paragraph [ref=f51e17]: Kairo CORE holds the records your school cannot afford to lose — students, guardians, fees and results. This page explains, in plain terms, how the platform keeps that data isolated, access-controlled and recoverable.
        - generic [ref=f51e18]:
          - link "Ask us about security" [ref=f51e19] [cursor=pointer]:
            - /url: https://lvh.me/contact
          - link "Read our terms" [ref=f51e20] [cursor=pointer]:
            - /url: https://lvh.me/terms
      - generic [ref=f51e21]:
        - generic [ref=f51e22]:
          - heading "Every school has its own isolated workspace" [level=2] [ref=f51e23]
          - paragraph [ref=f51e24]: "Kairo CORE is multi-tenant: each school’s data lives in a separate workspace, and every request is bound to the school you are logged into. One school’s students, fees or documents are never served to another school’s users."
        - generic [ref=f51e25]:
          - heading "Role-based access for every staff member" [level=2] [ref=f51e26]
          - paragraph [ref=f51e27]: Staff only see and do what their role allows. A form teacher’s view differs from a bursar’s; sensitive areas such as payroll, backups and platform administration require elevated permissions that you control.
        - generic [ref=f51e28]:
          - heading "Protected sessions and forms" [level=2] [ref=f51e29]
          - paragraph [ref=f51e30]: Login sessions use secure, HTTP-only cookies, with session encryption available, and every state-changing form is protected against cross-site request forgery. Account activation links are single-use and time-limited.
        - generic [ref=f51e31]:
          - heading "Strong password storage" [level=2] [ref=f51e32]
          - paragraph [ref=f51e33]: Passwords are never stored in readable form; the platform stores salted bcrypt hashes, and password resets go through expiring links rather than reversible copies.
        - generic [ref=f51e34]:
          - heading "Private documents stay private" [level=2] [ref=f51e35]
          - paragraph [ref=f51e36]: Student documents, invoices, receipts and reports are served only through authenticated, permission-checked endpoints — never as public files, and never listed in sitemaps or search indexes.
        - generic [ref=f51e37]:
          - heading "Backups you can rely on" [level=2] [ref=f51e38]
          - paragraph [ref=f51e39]: The platform includes backup management with restore points kept outside day-to-day operation, so a mistake or incident does not have to mean permanent data loss.
        - generic [ref=f51e40]:
          - heading "Out of reach of search engines by default" [level=2] [ref=f51e41]
          - paragraph [ref=f51e42]: Authenticated areas — workspaces, student portals and administration — are excluded from the public site index and from sitemaps. Private school data is protected by access control, not merely by obscurity.
        - generic [ref=f51e43]:
          - heading "Operated with care" [level=2] [ref=f51e44]
          - paragraph [ref=f51e45]: Dependencies are kept current, administrative access is restricted, and configuration defaults favour secure behaviour — such as production environments running with debug output disabled.
    - generic [ref=f51e47]:
      - heading "What we will never claim" [level=2] [ref=f51e48]
      - paragraph [ref=f51e49]: We do not publish certifications, compliance badges or “bank-level” slogans we cannot substantiate. If your school has specific data-protection requirements — auditor questions, PoPIA or other regulatory reviews, or procurement policies — talk to us and we will answer factually about how the platform works.
      - generic [ref=f51e50]:
        - link "Terms of Service" [ref=f51e51] [cursor=pointer]:
          - /url: https://lvh.me/terms
        - link "About Kairo CORE" [ref=f51e52] [cursor=pointer]:
