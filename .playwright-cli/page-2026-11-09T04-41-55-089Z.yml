        - text: / Five security habits every school should adopt
      - generic [ref=f57e33]: 16 Oct 2026
      - heading "Five security habits every school should adopt" [level=1] [ref=f57e34]
      - paragraph [ref=f57e35]: From shared logins to lost paper records, student data leaks quietly. Five practical habits that protect learners, staff and families.
      - generic [ref=f57e36]:
        - generic [ref=f57e37]: Security · 2 min read · Kairo CORE team
        - generic [ref=f57e38]:
          - button "Like 2" [ref=f57e39] [cursor=pointer]:
            - generic [ref=f57e42]: Like
            - emphasis [ref=f57e43]: "2"
          - button [ref=f57e44] [cursor=pointer]:
            - generic [ref=f57e50]:
              - text: Share
              - emphasis [ref=f57e51]: "0"
      - img "Five security habits every school should adopt" [ref=f57e53]
      - generic [ref=f57e54]:
        - paragraph [ref=f57e55]: "Schools hold some of the most sensitive records a person will ever have: identity documents, medical notes, grades and family contact details. Protecting them is not only an IT concern — it is a duty of care."
        - heading "1. One account per person" [level=2] [ref=f57e56]
        - paragraph [ref=f57e57]: Shared loggers make accountability impossible. Every staff member should have their own login with permissions scoped to their role — a class teacher does not need the same access as a bursar.
        - heading "2. Least privilege, reviewed often" [level=2] [ref=f57e58]
        - paragraph [ref=f57e59]: Permissions should grow and shrink with real responsibilities. Termly reviews catch accounts that still hold access from a role someone left years ago.
        - heading "3. Prefer systems that log" [level=2] [ref=f57e60]
        - paragraph [ref=f57e61]: A spreadsheet cannot tell you who changed a mark or deleted a receipt. Any platform handling student records should keep an audit trail of who did what and when.
        - heading "4. Verify documents instead of trusting them" [level=2] [ref=f57e62]
        - paragraph [ref=f57e63]:
          - text: Report cards and certificates that carry a public verification code remove the incentive to forge them — and the awkwardness of manual verification. See
          - link "our security overview" [ref=f57e64] [cursor=pointer]:
            - /url: /security
          - text: for how verification works.
        - heading "5. Backups you have actually tested" [level=2] [ref=f57e65]
        - paragraph [ref=f57e66]: A backup you have never restored is a hope, not a plan. Test recovery regularly, and prefer providers who encrypt data in transit and at rest.
        - paragraph [ref=f57e67]:
          - text: Kairo CORE ships with role-based permissions, audit logging and encrypted connections as standard. Read the
          - link "full security practices" [ref=f57e68] [cursor=pointer]:
            - /url: /security
          - text: ", or"
          - link "register your school" [ref=f57e69] [cursor=pointer]:
            - /url: /register
          - text: to get started securely.
