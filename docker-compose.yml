# =============================================================================
# Kairo CORE — Kuber VPS stack
#
#   Nginx Proxy Manager (kuber-npm) ──► kairocore-web:80   (shared proxy network)
#                                          │
#                                          ├──► kairocore-db:3306    (private network)
#                                          └──► kairocore-redis:6379 (private network)
#
# NOTHING is published on the host: no `ports:` anywhere. The database and
# redis live on an `internal: true` network, so they can't be reached from
# outside or from other stacks, and have no internet access. Only
# `kairocore-web` joins the shared NPM network.
# =============================================================================
name: kairocore

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: kairocore-app:latest
  restart: unless-stopped
  env_file: .env
  environment:
    # Force container-correct values regardless of what is in .env
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    DB_CONNECTION: mysql
    DB_HOST: kairocore-db
    DB_PORT: "3306"
    REDIS_HOST: kairocore-redis
    REDIS_PORT: "6379"
  volumes:
    - kairo_storage:/var/www/html/storage

services:

  # ── Web (Apache + PHP) ─────────────────────────────────────────────────────
  kairocore-web:
    <<: *app
    container_name: kairocore-web
    depends_on:
      kairocore-db:
        condition: service_healthy
      kairocore-redis:
        condition: service_healthy
    networks:
      - internal      # talks to the database
      - proxy         # reachable by NPM (also gives outbound internet)
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s   # first boot runs ~120 migrations before Apache starts

  # ── Queue worker (QUEUE_CONNECTION=database) ───────────────────────────────
  # Reports, emails, backups and school registration run as queued jobs.
  kairocore-queue:
    <<: *app
    container_name: kairocore-queue
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=3600", "--max-time=3600"]
    depends_on:
      kairocore-web:
        condition: service_healthy     # web runs migrations first
      kairocore-redis:
        condition: service_healthy
    networks:
      - internal
      - egress        # outbound only (SMTP, Paynow); not on the shared proxy network
    mem_limit: 512m
    cpus: "0.5"
    pids_limit: 100

  # ── Scheduler (routes/console.php: reminders, billing, trial expiry) ───────
  kairocore-scheduler:
    <<: *app
    container_name: kairocore-scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      kairocore-web:
        condition: service_healthy
      kairocore-redis:
        condition: service_healthy
    networks:
      - internal
      - egress
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 100

  # ── Redis (sessions + cache; appendonly so state survives restarts) ────────
  kairocore-redis:
    image: redis:7-alpine
    container_name: kairocore-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - kairo_redisdata:/data
    networks:
      - internal      # ONLY the private network (no internet, not shared)
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 100
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── MySQL ──────────────────────────────────────────────────────────────────
  kairocore-db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    container_name: kairocore-db
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env (must NOT be root)}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - kairo_dbdata:/var/lib/mysql
    networks:
      - internal      # ONLY the private network
    mem_limit: 1536m
    cpus: "1.0"
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  kairo_dbdata:
  kairo_redisdata:
  kairo_storage:

networks:
  # Private, no route to the internet or to other stacks
  internal:
    internal: true

  # Outbound-only network for the worker/scheduler (not shared with anything)
  egress:

  # Existing Nginx Proxy Manager network. Confirm the real name on the VPS:
  #   docker inspect kuber-npm --format '{{json .NetworkSettings.Networks}}'
  proxy:
    external: true
    name: ${PROXY_NETWORK:-kuber-proxy}
