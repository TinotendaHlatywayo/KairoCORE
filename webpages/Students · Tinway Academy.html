function tab(n){const V={s:'Students',t:'Tpl',c:'Create'};Object.keys(V).forEach(k=>$('#v'+V[k]).hidden=k!==n);$('#tabS').classList.toggle('on',n==='s');$('#tpl').classList.toggle('on',n==='t');document.querySelector('.tabs').style.display=n==='c'?'none':'';$('#tic').textContent=TT[n][0];$('#ttl').textContent=TT[n][1];$('#sub').textContent=TT[n][2];document.title=TT[n][1]+' · Tinway Academy';if(n==='t')renderT();scrollTo({top:0,behavior:'smooth'})}
function helpM(){modal(`<h2>Student directory &amp; profiles</h2><p class='mut'>Complete lifecycle manager for all enrolled learners, covering personal details, enrollment streams, guardians, and bulk tools.</p><h4 style='margin:14px 0 0'>Step-by-step workflow</h4><ol class='wf'>${[['New student:','register a learner with personal details, guardian contacts, medical notes and class/stream assignment.'],['Template and import:','fill the Excel template (required fields are marked) and import learners in batch with automated validation and error logs.'],['View and edit:','inspect student information, photo and enrollment details, or update records.'],['Export all:','export the full roster as a formatted Excel spreadsheet or a fit-to-page PDF report.'],['Row actions:','view, edit or print IDs from each card, and use bulk actions to email, print or delete securely.']].map(x=>`<li><span><b>${x[0]}</b> ${x[1]}</span></li>`).join('')}</ol><p class='mut'><b>Cross-module link:</b> students registered here are automatically linked to Finance for invoicing, Attendance tracking and Exam report cards.</p><div class='foot'><button class='btn pri' data-x>Close</button></div>`,'min(640px,100%)')}
function importM(){modal(`<h2>Import students from Excel or CSV</h2><p class='mut'>Upload your file and the system matches every column automatically.</p><div class='steps'><span class='on' id='s1'>1 · Upload</span><span id='s2'>2 · Validate</span><span id='s3'>3 · Import</span></div><button class='btn sm' id='dt'>⬇ Download Excel template</button><label class='drop' id='idrop'><input type='file' hidden id='ifile' accept='.csv,.xlsx,.xls'><b id='iname'>Drag &amp; drop your file or <u>browse</u></b><small>.xlsx, .xls or .csv</small></label><div style='margin:14px 0'><div class='pbar'><i id='ipb' style='width:0'></i></div><small id='ipt' class='mut'>Progress appears here.</small></div><div class='foot'><button class='btn' data-x>Cancel</button><button class='btn pri' id='igo' disabled>Import students</button></div>`);
 const pick=f=>{if(!f)return;$('#iname').textContent=f.name;$('#igo').disabled=false;$('#s1').classList.remove('on');$('#s2').classList.add('on');$('#ipt').textContent='File ready. Click Import to continue.'};
 $('#ifile').onchange=e=>pick(e.target.files[0]);const d=$('#idrop');['dragover','dragenter'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.add('over')}));['dragleave','drop'].forEach(n=>d.addEventListener(n,e=>{e.preventDefault();d.classList.remove('over');if(n==='drop')pick(e.dataTransfer.files[0])}));
 $('#dt').onclick=()=>toast('Template download starts');
 $('#igo').onclick=()=>{let p=0;$('#igo').disabled=true;$('#s2').classList.remove('on');$('#s3').classList.add('on');const iv=setInterval(()=>{if(!$('#ipb')){clearInterval(iv);return}p+=5;$('#ipb').style.width=p+'%';$('#ipt').textContent='Importing… '+p+'%';if(p>=100){clearInterval(iv);toast('Import complete');setTimeout(close,600)}},90)}}
const opt=a=>a.map(x=>`<option>${x}</option>`).join('');
const fl=(l,id,t,ph,o)=>{const rq=l.endsWith('*'),L=l.replace('*',''),a=rq?'data-req':'';t=t||'text';return `<div class='fld${t==='area'?' full':''}'><label for='${id}'>${L}${rq?`<i class='rq'>*</i>`:''}</label>`+(t==='select'?`<select id='${id}' ${a}><option value=''>Select an option</option>${opt(o)}</select>`:t==='area'?`<textarea id='${id}' placeholder='${ph||''}'></textarea>`:`<input id='${id}' type='${t}' placeholder='${ph||''}' ${a}>`)+`</div>`};
const pn=(h,d,b,x)=>`<div class='panel'><h3>${h}</h3>${d?`<p>${d}</p>`:''}<div class='fgrid'>${b}</div>${x||''}</div>`;
function buildForm(){let phd='';const V=$('#vCreate');
 const P=[
  pn('Student information','Basic details exactly as on the birth certificate.',fl('First name*','fn','text','e.g., Tendai')+fl('Last name*','ln','text','e.g., Moyo')+fl('Gender*','gd','select','',['Male','Female'])+fl('Date of birth*','db','date')+fl('National ID','ni','text','e.g., 63-123456A78')+fl('Contact number','ph','tel','e.g., +263 77 123 4567')+fl('Email address','em','email','e.g., tendai@example.com')+fl('Physical address','ad','area','e.g., 14 Links Lane, Borrowdale, Harare'))+
  `<div class='panel'><h3>Photo</h3><p>Used on ID cards, invoices and reports. Without an upload, a gender silhouette is shown.</p><label class='drop' id='drop'><input type='file' accept='image/*' hidden id='photo'><div class='pv' id='pv'>${sil('Male')}</div><b>Drag &amp; drop a photo or <u>browse</u></b><small>PNG or JPG</small></label></div>`+
  pn('Guardian & emergency contact','',fl('Parent / guardian email','ge','email')+fl('Emergency contact name','en')+fl('Emergency contact phone','ep','tel'))+
  pn('Boarding & health','',fl('House','ho','text','e.g., Chiadzwa')+fl('Boarding status','bs','select','',['Day Scholar','Boarder'])+fl('Blood group','bg','select','',['A+','A-','B+','B-','AB+','AB-','O+','O-'])+fl('Medical notes','mn','area','Allergies, chronic conditions, medication…'))+
  pn('Admission details','',fl('Student ID','sid','text','Auto-generated')+fl('Admission number','an','text','Auto-generated')+fl('Admission date*','ad2','date')+fl('Status*','stt','select','',['Active','Pending']),`<div class='row'><button class='sw' id='fw' role='switch' aria-checked='false' aria-label='Apply fee waiver'></button><div><b>Apply fee waiver</b><small>Grant this student a tuition waiver or scholarship.</small></div></div>`),
  pn('Current enrollment','Assign the student to a form / grade and stream for the active academic year.',fl('Academic year*','ay','select','',['2026','2025'])+fl('Form / grade (level)*','lv','select','',['ECD A','ECD B','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Special Class'])+fl('Stream / class*','sc','select','',['A','B','C'])+fl('Roll number','rn','number')),
  `<div class='panel'><h3>Custom fields</h3><p>Add extra data such as a parent email or alternative phone.</p><div id='cfs'></div><div style='margin-top:14px'><button class='btn sm' id='cfa'>+ Add custom field</button></div></div>`,
  pn('Card status','',fl('Card status','cs','select','',['Pending issuance','Issued','Expired','Lost'])+fl('Card expiry date','ce','date'))+`<div class='panel'><h3>Card preview</h3><p>Uses the active template.</p><div class='stage' id='cpv' style='margin-top:14px'></div></div>`];
 $('#fpanes').innerHTML=P.map((h,i)=>`<div data-fp='${i}' ${i?'hidden':''}>${h}</div>`).join('');
 const df=()=>{$('#ad2').value=new Date().toISOString().slice(0,10);$('#stt').value='Active';$('#bs').value='Day Scholar';$('#ay').value='2026';$('#cs').value='Pending issuance';$('#sid').disabled=$('#an').disabled=true};df();
 const cfAdd=()=>$('#cfs').insertAdjacentHTML('beforeend',`<div class='cfr'><div class='fld'><label>Field name<i class='rq'>*</i></label><input placeholder='e.g., Parent email'></div><div class='fld'><label>Field value<i class='rq'>*</i></label><input></div><button class='btn sm danger' data-cfx aria-label='Remove field'>🗑</button></div>`);cfAdd();
 const prog=()=>{const rq=[...V.querySelectorAll('[data-req]')],d=rq.filter(i=>i.value).length;$('#fpn').textContent=d+' of '+rq.length+' required fields';$('#fpb').style.width=(d/rq.length*100)+'%'};prog();
 const ft=i=>{V.querySelectorAll('[data-fp]').forEach(p=>p.hidden=+p.dataset.fp!==i&&!(i===0&&+p.dataset.fp===0));V.querySelectorAll('[data-fp]').forEach(p=>p.hidden=+p.dataset.fp!==i);V.querySelectorAll('[data-ft]').forEach(b=>b.classList.toggle('on',+b.dataset.ft===i));if(i===3)$('#cpv').innerHTML=idc(T.find(t=>t.on)||T[0],{n:($('#fn').value+' '+$('#ln').value).trim()||'Student Name',id:'R000000A',c:($('#lv').value+' '+$('#sc').value).trim()||'Class'})};
 V.addEventListener('input',e=>{e.target.classList.remove('bad');prog();if(e.target.id==='gd'&&!phd)$('#pv').innerHTML=sil(e.target.value||'Male')});
 V.addEventListener('click',e=>{const b=e.target.closest('[data-ft]');if(b)ft(+b.dataset.ft);if(e.target.id==='cfa')cfAdd();const x=e.target.closest('[data-cfx]');if(x)x.parentElement.remove();const g=e.target.closest('[data-go]');if(g)tab(g.dataset.go);if(e.target.closest('#fw')){const w=$('#fw');w.classList.toggle('on');w.setAttribute('aria-checked',w.classList.contains('on'))}});
 const pf=f=>{if(!f)return;const r=new FileReader();r.onload=()=>{phd=r.result;$('#pv').innerHTML=`<img src='${phd}' alt='Student photo preview'>`};r.readAsDataURL(f)};
 $('#photo').onchange=e=>pf(e.target.files[0]);const dz=$('#drop');['dragover','dragenter'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over');if(n==='drop')pf(e.dataTransfer.files[0])}));
 const sub=again=>{const bad=[...V.querySelectorAll('[data-req]')].filter(i=>!i.value);if(bad.length){bad.forEach(i=>i.classList.add('bad'));ft(+bad[0].closest('[data-fp]').dataset.fp);bad[0].focus();toast(bad.length+' required field'+(bad.length>1?'s':'')+' missing');return}
  const v=id=>$('#'+id).value,age=Math.max(0,new Date().getFullYear()-new Date(v('db')).getFullYear());
  S.unshift({id:'R'+Math.floor(100000+Math.random()*899999)+'A',n:v('fn')+' '+v('ln'),g:v('gd'),c:v('lv')+' '+v('sc'),age,en:v('ad2'),b:v('bs'),st:v('stt')});
  V.querySelectorAll('input:not([disabled]),textarea').forEach(i=>i.value='');V.querySelectorAll('select').forEach(s=>s.value='');df();phd='';$('#pv').innerHTML=sil('Male');$('#cfs').innerHTML='';cfAdd();prog();
  F.g=F.s=F.c='All';F.q='';$('#q').value='';render();ft(0);if(again){toast('Student created. Add another');scrollTo({top:0,behavior:'smooth'})}else{tab('s');toast('Student created')}};
 $('#fc').onclick=()=>sub(false);$('#fca').onclick=()=>sub(true);$('#fx').onclick=()=>tab('s')}
buildForm();
function code(bc,seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>(h=(h*1103515245+12345)>>>0)/4294967296;let s='';
 if(bc==='QR Code'){for(let y=0;y<9;y++)for(let x=0;x<9;x++)if(r()>.5)s+=`<rect x='${x*3}' y='${y*3}' width='3' height='3'/>`;return `<svg viewBox='0 0 27 27' class='code qr' fill='#141a33'>${s}</svg>`}
 let x=0;while(x<120){const w=1+Math.floor(r()*3);if(r()>.4)s+=`<rect x='${x}' y='0' width='${w}' height='20'/>`;x+=w+1}return `<svg viewBox='0 0 120 20' preserveAspectRatio='none' class='code' fill='#141a33'>${s}</svg>`}
const idc=(t,s)=>{s=s||S[0]||{n:'Student Name',id:'R000000A',c:'Class'};return `<div class='id-c ${t.o}' style='--a:${t.a};--b:${t.b}'><div class='id-h'>🎓 Tinway Academy</div><div class='id-b'><div class='id-p'>${ini(s.n)}</div><div class='id-t'><b>${esc(s.n)}</b><small>${s.id}</small><small>${esc(s.c)}</small></div></div>${code(t.bc,t.n+s.id)}</div>`};
function renderT(){const r=T.filter(t=>t.n.toLowerCase().includes(tq.toLowerCase()));
 $('#tgrid').innerHTML=r.length?r.map((t,i)=>`<article class='tc' style='animation-delay:${i*70}ms'><div class='stage'>${idc(t)}</div><div class='tm'><h3 style='margin:0;font-size:15px'>${esc(t.n)}</h3><span style='display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)'>${t.on?'Active':'Inactive'}<button class='sw ${t.on?'on':''}' data-ta='on' data-id='${t.id}' role='switch' aria-checked='${t.on}' aria-label='Set active'></button></span></div><div class='tm'><span><span class='tag' style='--c:var(--brand)'>${t.o}</span> <span class='tag' style='--c:var(--brand2)'>${t.bc}</span></span></div><div class='acts'><button class='btn sm' data-ta='pv' data-id='${t.id}'>👁 Preview</button><button class='btn sm' data-ta='dup' data-id='${t.id}'>⧉ Duplicate</button><button class='btn sm' data-ta='edit' data-id='${t.id}'>✎ Edit</button><button class='btn sm danger' data-ta='del' data-id='${t.id}' aria-label='Delete'>🗑</button></div></article>`).join(''):`<div class='empty' style='grid-column:1/-1'><b>No templates found</b>Create a card template to start printing IDs.</div>`;
 $('#tcount').textContent='Showing '+r.length+' result'+(r.length===1?'':'s')}
function tact(a,id){const t=T.find(x=>x.id===id);
 if(a==='on'){T.forEach(x=>x.on=x===t?!t.on:false);renderT();toast(t.on?t.n+' is now active':'No active template')}
 if(a==='pv'){modal(`<h2>${esc(t.n)}</h2><div class='stage' id='tp'>${idc(t)}</div><div class='fld' style='margin-top:12px'><label>Preview with student</label><select id='ps'>${S.map((s,i)=>`<option value='${i}'>${esc(s.n)}</option>`).join('')}</select></div><div class='foot'><button class='btn' data-x>Close</button></div>`);$('#ps').onchange=e=>$('#tp').innerHTML=idc(t,S[e.target.value])}
 if(a==='dup'){T.push({...t,id:Date.now(),n:t.n.replace(' (Default)','')+' (copy)',on:false});renderT();toast('Template duplicated')}
 if(a==='edit')tform(t);
 if(a==='del'){const i=T.indexOf(t);T.splice(i,1);renderT();toast('Template deleted',()=>{T.splice(i,0,t);renderT()})}}
function tform(t){const e=!!t;t=t||{n:'',o:'landscape',bc:'Code128',a:'#4f46e5',b:'#06b6d4',on:false};
 const cur=()=>({...t,n:$('#t-n').value||'New template',o:$('#t-o').value,bc:$('#t-b').value,a:$('#t-a').value,b:$('#t-c').value});
 modal(`<h2>${e?'Edit':'New'} card template</h2><div class='stage' id='tp' style='margin-bottom:12px'>${idc(t)}</div><div class='fld'><label>Template name</label><input id='t-n' value='${esc(t.n)}' placeholder='e.g. Modern portrait'></div><div class='row2'><div class='fld'><label>Orientation</label><select id='t-o'><option ${t.o==='landscape'?'selected':''}>landscape</option><option ${t.o==='portrait'?'selected':''}>portrait</option></select></div><div class='fld'><label>Barcode standard</label><select id='t-b'>${['Code128','Code39','EAN-13','QR Code'].map(b=>`<option ${t.bc===b?'selected':''}>${b}</option>`).join('')}</select></div></div><div class='row2'><div class='fld'><label>Header color</label><input id='t-a' type='color' value='${t.a}'></div><div class='fld'><label>Accent color</label><input id='t-c' type='color' value='${t.b}'></div></div><div class='foot'><button class='btn' data-x>Cancel</button><button class='btn pri' id='ts'>${e?'Save changes':'Create template'}</button></div>`);
 document.querySelectorAll('#modal input,#modal select').forEach(i=>i.oninput=()=>$('#tp').innerHTML=idc(cur()));
 $('#ts').onclick=()=>{const n=$('#t-n').value.trim();if(!n){toast('Enter a template name');return}Object.assign(e?t:(t={id:Date.now(),on:false}),cur(),{n});if(!e)T.push(t);close();renderT();toast(e?'Template saved':'Template created')}}
$('#tpl').onclick=()=>tab('t');$('#tabS').onclick=()=>tab('s');$('#tq').oninput=e=>{tq=e.target.value;renderT()};$('#tnew').onclick=()=>tform();
$('#tbulk').onclick=()=>{const cl=[...new Set(S.map(s=>s.c))];modal(`<h2>Bulk print ID cards</h2><div class='fld'><label>Class</label><select id='bp-c'><option value='All'>All classes</option>${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class='fld'><label>Template</label><select id='bp-t'>${T.map(t=>`<option>${esc(t.n)}</option>`).join('')}</select></div><p id='bp-n' style='color:var(--muted)'></p><div class='foot'><button class='btn' data-x>Cancel</button><button class='btn pri' id='bp-g'>Print cards</button></div>`);const up=()=>{$('#bp-n').textContent=S.filter(s=>$('#bp-c').value==='All'||s.c===$('#bp-c').value).length+' cards will be printed'};$('#bp-c').onchange=up;up();$('#bp-g').onclick=()=>{close();toast('Sent '+$('#bp-n').textContent.split(' ')[0]+' ID cards to the printer')}};
$('#exp').onclick=()=>toast('Exporting '+list().length+' students');
function bulk(a){const n=sel.size,s=n>1?'s':'';$('#menu2').classList.remove('show');
 if(a==='mail')toast('Activation email sent to '+n+' student'+s);
 if(a==='print')toast('Printing '+n+' ID card'+s);
 if(a==='png')toast('Preparing '+n+' PNG file'+s+' for download');
 if(a==='del'){modal(`<h2>Delete ${n} student${s}?</h2><p style="color:var(--muted)">This removes the selected records. You can undo right after.</p><div class="foot"><button class="btn" data-x>Cancel</button><button class="btn pri" id="cd" style="background:var(--bad)">Delete ${n}</button></div>`);
  $('#cd').onclick=()=>{const gone=S.filter(x=>sel.has(x.id));S=S.filter(x=>!sel.has(x.id));sel.clear();close();render();toast(gone.length+' deleted',()=>{S.push(...gone);render()})}}}

$('#menu').onclick=()=>innerWidth>820?document.body.classList.toggle('mini'):document.body.classList.toggle('open');
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('#q').focus()}if(e.key==='Escape')close()});
$('#date').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'});
setTimeout(render,500);
</script>
