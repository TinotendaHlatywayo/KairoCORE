<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairo CORE FAQ: chat v2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f9fd;--surface:#ffffff;--chat:#f3f5fb;--dot:rgba(27,42,68,.07);--ink:#1c2a44;--muted:#6b7691;--line:#e6eaf4;
  --accent:#ea5a41;--accent2:#f2804f;--soft:#fff1ed;--soft-line:rgba(234,90,65,.28);--shadow:rgba(28,42,68,.32);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1325;--surface:#161d35;--chat:#111830;--dot:rgba(255,255,255,.06);--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
    --accent:#ff6a52;--accent2:#ff8d5c;--soft:#2e2338;--soft-line:rgba(255,106,82,.35);--shadow:rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1325;--surface:#161d35;--chat:#111830;--dot:rgba(255,255,255,.06);--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
  --accent:#ff6a52;--accent2:#ff8d5c;--soft:#2e2338;--soft-line:rgba(255,106,82,.35);--shadow:rgba(0,0,0,.7);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
button,input{font:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:88px 24px;display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:center}

.eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent);font-weight:700;font-size:13px;margin-bottom:14px}
.eyebrow::before{content:"";width:32px;height:2px;background:var(--accent)}
h2{margin:0 0 16px;font-size:clamp(32px,4.4vw,46px);line-height:1.06;letter-spacing:-.03em;font-weight:800}
.lead{margin:0 0 28px;color:var(--muted);font-size:16.5px;max-width:34ch}
.talk{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.talk:hover{border-color:#25d366;transform:translateY(-2px)}
.talk:focus-visible,.chip:focus-visible,.reset:focus-visible,.send:focus-visible,.wa-pill:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.talk .ic{width:44px;height:44px;flex:none;border-radius:14px;background:#25d366;color:#06361a;display:grid;place-items:center}
.talk b{display:block;font-size:15px;line-height:1.25}
.talk span{font-size:13.5px;color:var(--muted)}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 44px 80px -48px var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.av,.head .logo{width:40px;height:40px;flex:none;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.head .logo{position:relative}
.head .logo::after{content:"";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#2fbf71;border:2px solid var(--surface)}
.head b{display:block;font-size:15px;line-height:1.2}
.head small{color:var(--muted);font-size:12.5px}
.reset{margin-left:auto;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s}
.reset:hover{color:var(--ink);border-color:var(--ink)}

.msgs{height:372px;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px;background:var(--chat);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;scroll-behavior:smooth}
.row{display:flex;align-items:flex-end;gap:10px;animation:in .3s ease both}
.row.me{justify-content:flex-end}
.row .av{width:30px;height:30px;border-radius:10px;font-size:13px}
.bub{max-width:80%;padding:12px 16px;font-size:15px;line-height:1.5;border-radius:18px}
.bub p{margin:0}
.bot .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.me .bub{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;border-bottom-right-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.tags li{padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--soft-line);font-size:12.5px;font-weight:600}
.wa-pill{display:inline-block;margin-top:12px;padding:8px 14px;border-radius:999px;background:#25d366;color:#06361a;font-size:13px;font-weight:700;text-decoration:none}
.dots{display:flex;gap:5px;padding:16px 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.quick{padding:14px 20px 4px;border-top:1px solid var(--line);min-height:92px}
.label{margin:0 0 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s}
.chip:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}
.form{display:flex;gap:10px;padding:12px 20px 18px}
.form input{flex:1;min-width:0;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--chat);color:var(--ink);font-size:14.5px}
.form input::placeholder{color:var(--muted)}
.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.send:hover{transform:scale(1.06)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:36px;padding:56px 18px}
  .msgs{height:360px}
  .bub{max-width:88%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .msgs{scroll-behavior:auto}
}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <div class="eyebrow">FAQ</div>
    <h2>Questions school leaders ask us</h2>
    <p class="lead">Tap a question or type your own. Can’t find your answer? Talk to a person.</p>
    <a class="talk" href="https://wa.me/263786366855" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z"/></svg></span>
      <span><b>Chat on WhatsApp</b><span>+263 78 636 6855</span></span>
    </a>
  </div>

  <section class="chat" aria-label="Frequently asked questions">
    <div class="head">
      <div class="logo" aria-hidden="true">K</div>
      <div><b>Kairo CORE team</b><small>Online · answers instantly</small></div>
      <button class="reset" id="reset" type="button">Start over</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
    <form class="form" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="Ask your own question…" aria-label="Ask your own question">
      <button class="send" type="submit" aria-label="Send question"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
  </section>
</main>

<script>
const WA = "https://wa.me/263786366855";
const FAQ = [
  {q:"Is Kairo CORE built for my type of school?",
   a:"Yes. It’s designed for primary, secondary and tertiary institutions, including boarding schools.",
   tags:["Primary","Secondary","Tertiary","Boarding"],
   k:["school","type","primary","secondary","tertiary","boarding","college","academy"]},
  {q:"What does it cover?",
   a:"The day-to-day running of your school in one system, from admissions and fees to academics and parent communication.",
   tags:["Admissions","Fees","Academics","Attendance","HR & Payroll","Library"],
   k:["cover","include","feature","module","admission","fee","attendance","payroll","library","exam","hr"]},
  {q:"Is our data safe?",
   a:"Your school’s records stay private to your school, and staff only see what their role allows.",
   tags:["Cloud-hosted","Role-based access","Backed up"],
   k:["data","safe","secure","security","privacy","private","backup"]},
  {q:"Will my team be trained?",
   a:"Yes. Your team is trained through hands-on sessions, video tutorials and a help centre on call. Extra training can be arranged.",
   tags:["Hands-on sessions","Video tutorials","Help centre"],
   k:["train","tutorial","onboard","learn","help","support","team"]},
  {q:"Can we access it from any device?",
   a:"Yes. Use it on a phone, tablet or computer with an internet connection.",
   tags:["Phone","Tablet","Computer"],
   k:["device","phone","mobile","tablet","laptop","computer","access","online","app"]}
];

const $ = id => document.getElementById(id);
const msgs = $("msgs"), quick = $("quick"), form = $("form"), input = $("input");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let asked = new Set(), busy = false;

const down = () => { msgs.scrollTop = msgs.scrollHeight; };
function row(cls){
  const r = document.createElement("div");
  r.className = "row " + cls;
  msgs.appendChild(r);
  return r;
}
function me(text){
  const b = document.createElement("div");
  b.className = "bub";
  b.textContent = text;
  row("me").appendChild(b);
  down();
}
function bot(text, tags, wa){
  const r = row("bot");
  r.innerHTML = '<span class="av" aria-hidden="true">K</span>';
  const b = document.createElement("div");
  b.className = "bub";
  const p = document.createElement("p");
  p.textContent = text;
  b.appendChild(p);
  if (tags && tags.length){
    const u = document.createElement("ul");
    u.className = "tags";
    tags.forEach(t => { const l = document.createElement("li"); l.textContent = t; u.appendChild(l); });
    b.appendChild(u);
  }
  if (wa){
    const a = document.createElement("a");
    a.className = "wa-pill";
    a.href = WA; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Message us on WhatsApp";
    b.appendChild(a);
  }
  r.appendChild(b);
  down();
}
function typing(){
  const r = row("bot");
  r.innerHTML = '<span class="av" aria-hidden="true">K</span><div class="bub dots"><i></i><i></i><i></i></div>';
  down();
  return r;
}
function chips(){
  quick.innerHTML = "";
  const left = FAQ.map((f, i) => i).filter(i => !asked.has(i));
  const label = document.createElement("p");
  label.className = "label";
  label.textContent = left.length ? "Suggested questions" : "That’s every common question. Type your own below.";
  quick.appendChild(label);
  if (!left.length) return;
  const wrap = document.createElement("div");
  wrap.className = "chips";
  left.forEach(i => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = FAQ[i].q;
    b.onclick = () => ask(i);
    wrap.appendChild(b);
  });
  quick.appendChild(wrap);
}
function say(userText, build){
  if (busy) return;
  busy = true;
  me(userText);
  const t = typing();
  setTimeout(() => { t.remove(); build(); busy = false; }, reduce ? 0 : 800);
}
function ask(i, text){
  if (busy) return;
  asked.add(i);
  chips();
  say(text || FAQ[i].q, () => bot(FAQ[i].a, FAQ[i].tags));
}

form.onsubmit = e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v || busy) return;
  input.value = "";
  const l = v.toLowerCase();
  let best = -1, score = 0;
  FAQ.forEach((f, i) => {
    const s = f.k.filter(w => l.includes(w)).length;
    if (s > score){ score = s; best = i; }
  });
  if (best >= 0) ask(best, v);
  else say(v, () => bot("I don’t have that one yet. Message the team on WhatsApp and a person will help.", null, true));
};

function start(){
  msgs.innerHTML = "";
  asked = new Set([0]);
  busy = false;
  bot("Hi, I’m here to answer the questions school leaders ask most. Tap one below or type your own.");
  me(FAQ[0].q);
  bot(FAQ[0].a, FAQ[0].tags);
  chips();
}
$("reset").onclick = start;
start();
</script>
</body>
</html>
