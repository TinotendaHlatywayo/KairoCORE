<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairo CORE FAQ: chat v3</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f9fd;--surface:#ffffff;--chat:#f3f5fb;--dot:rgba(27,42,68,.07);--ink:#1c2a44;--muted:#6b7691;--line:#e6eaf4;
  --accent:#ea5a41;--accent2:#f2804f;--soft:#fff1ed;--soft-line:rgba(234,90,65,.28);--shadow:rgba(28,42,68,.32);--user:#dfe5f3;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1325;--surface:#161d35;--chat:#111830;--dot:rgba(255,255,255,.06);--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
    --accent:#ff6a52;--accent2:#ff8d5c;--soft:#2e2338;--soft-line:rgba(255,106,82,.35);--shadow:rgba(0,0,0,.7);--user:#2a3458;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1325;--surface:#161d35;--chat:#111830;--dot:rgba(255,255,255,.06);--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
  --accent:#ff6a52;--accent2:#ff8d5c;--soft:#2e2338;--soft-line:rgba(255,106,82,.35);--shadow:rgba(0,0,0,.7);--user:#2a3458;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
button,input{font:inherit;color:inherit}
svg{display:block}
.wrap{max-width:1040px;margin:0 auto;padding:72px 24px;display:grid;grid-template-columns:5fr 7fr;gap:56px;align-items:center}

.eyebrow{display:flex;align-items:center;gap:12px;color:var(--accent);font-weight:700;font-size:13px;margin-bottom:14px}
.eyebrow::before{content:"";width:32px;height:2px;background:var(--accent)}
h2{margin:0 0 16px;font-size:clamp(32px,4.4vw,46px);line-height:1.06;letter-spacing:-.03em;font-weight:800}
.lead{margin:0 0 28px;color:var(--muted);font-size:16.5px;max-width:34ch}
.talk{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:inherit;text-decoration:none;transition:border-color .2s,transform .2s}
.talk:hover{border-color:#25d366;transform:translateY(-2px)}
.talk .ic{width:44px;height:44px;flex:none;border-radius:14px;background:#25d366;color:#06361a;display:grid;place-items:center}
.talk b{display:block;font-size:15px;line-height:1.25}
.talk span{font-size:13.5px;color:var(--muted)}
:is(.talk,.chip,.reset,.send,.wa-pill,.src,.jump,.opt,.fb button):focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* chat card */
.chat{display:flex;flex-direction:column;height:min(680px,calc(100dvh - 48px));min-height:560px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 44px 80px -48px var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.brand svg{width:30px;height:30px}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand b i{font-style:normal;display:block;font-size:9.5px;letter-spacing:.2em;color:var(--accent);margin-top:2px}
.who{min-width:0}
.who b{display:block;font-size:14.5px;line-height:1.2}
.who small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.who small::before{content:"";width:7px;height:7px;border-radius:50%;background:#2fbf71}
.reset{margin-left:auto;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.reset svg{width:14px;height:14px}
.reset:hover{color:var(--ink);border-color:var(--ink)}

.stage{position:relative;flex:1;min-height:0}
.msgs{height:100%;overflow-y:auto;padding:18px 18px 22px;display:flex;flex-direction:column;gap:16px;background:var(--chat);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:18px 18px;scroll-behavior:smooth}
.day{align-self:center;padding:4px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--muted)}
.jump{position:absolute;right:16px;bottom:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:none;place-items:center;cursor:pointer;box-shadow:0 8px 20px -8px var(--shadow)}
.jump.on{display:grid}
.jump svg{width:18px;height:18px}

.row{display:flex;align-items:flex-end;gap:10px;animation:in .3s ease both}
.row.me{flex-direction:row-reverse}
.pic{width:34px;height:34px;flex:none;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.pic svg{width:100%;height:100%}
.pic.u{background:var(--user);color:var(--muted);border-radius:50%}
.pic.u svg{width:20px;height:20px}
.col{max-width:78%;min-width:0}
.me .col{display:flex;flex-direction:column;align-items:flex-end}
.bub{padding:12px 16px;font-size:15px;border-radius:18px;overflow-wrap:anywhere}
.bub p{margin:0}
.bot .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.me .bub{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;border-bottom-right-radius:6px}
.meta{margin:5px 6px 0;font-size:11.5px;color:var(--muted)}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.15em;background:var(--accent);animation:blink .8s steps(1) infinite}
.dots{display:flex;gap:5px;padding:16px 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}

.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.tags li{padding:5px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--soft-line);font-size:12.5px;font-weight:600}
.src{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--chat);color:inherit;text-decoration:none;font-size:13px;transition:border-color .15s}
.src:hover{border-color:var(--accent)}
.src svg{width:18px;height:18px;flex:none;color:var(--accent)}
.src small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.src b{font-weight:600;line-height:1.3}
.wa-pill{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:9px 15px;border-radius:999px;background:#25d366;color:#06361a;font-size:13px;font-weight:700;text-decoration:none}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background-color .15s}
.opt:hover{border-color:var(--accent);background:var(--soft)}
.fb{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:10px;font-size:12px;color:var(--muted)}
.fb button{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.fb button:hover{color:var(--accent);border-color:var(--accent)}
.fb svg{width:15px;height:15px}
.follow{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 0 44px;animation:in .3s ease both}
.follow .chip{font-size:13px;padding:7px 13px}

.quick{border-top:1px solid var(--line);padding:12px 0 10px}
.label{margin:0 18px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rail{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;justify-items:start;gap:8px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
.rail::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start;white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s}
.chip:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-1px)}

.form{display:flex;gap:10px;padding:4px 18px 8px}
.form input{flex:1;min-width:0;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--chat);font-size:14.5px}
.form input::placeholder{color:var(--muted)}
.form input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.send{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .15s,opacity .15s}
.send svg{width:20px;height:20px}
.send:hover:not(:disabled){transform:scale(1.06)}
.send:disabled{opacity:.4;cursor:default}
.note{display:flex;justify-content:space-between;gap:12px;padding:0 22px 14px;font-size:11.5px;color:var(--muted)}

@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:32px;padding:48px 16px}
  .chat{height:640px;max-height:calc(100dvh - 24px)}
  .col{max-width:86%}
  .brand b i{display:none}
  .reset span{display:none}
  .follow{margin-left:0}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .msgs{scroll-behavior:auto}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="kg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea5a41"/><stop offset="1" stop-color="#f2804f"/></linearGradient></defs>
  <!-- REPLACE kmark with the real Kairo CORE favicon and the brand block with the real logo -->
  <symbol id="kmark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#kg)"/><path d="M11 8v16M12 16.5l8.5-8.5M14 15l7 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M7 11v9H4v-9zM7 11l4-8c1.7 0 2.5 1.2 2.2 2.8L12.8 9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M17 13V4h3v9zM17 13l-4 8c-1.7 0-2.5-1.2-2.2-2.8L11.2 15H5a2 2 0 0 1-2-2.3l1.2-7A2 2 0 0 1 6.2 4H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="doc" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="wa" viewBox="0 0 24 24"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<main class="wrap">
  <div>
    <div class="eyebrow">FAQ</div>
    <h2>Questions school leaders ask us</h2>
    <p class="lead">Tap a question or type your own. Can’t find your answer? Talk to a person.</p>
    <a class="talk" href="https://wa.me/263786366855" target="_blank" rel="noopener">
      <span class="ic" aria-hidden="true"><svg width="22" height="22"><use href="#wa"/></svg></span>
      <span><b>Chat on WhatsApp</b><span>+263 78 636 6855</span></span>
    </a>
  </div>

  <section class="chat" aria-label="Kairo assistant">
    <div class="head">
      <div class="brand" aria-label="Kairo CORE"><svg aria-hidden="true"><use href="#kmark"/></svg><b>Kairo<i>CORE</i></b></div>
      <div class="who"><b>Kairo assistant</b><small>Online · answers instantly</small></div>
      <button class="reset" id="reset" type="button"><svg aria-hidden="true"><use href="#refresh"/></svg><span>Start over</span></button>
    </div>
    <div class="stage">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <button class="jump" id="jump" type="button" aria-label="Jump to latest message"><svg aria-hidden="true"><use href="#arrow"/></svg></button>
    </div>
    <div class="quick" id="quick"></div>
    <form class="form" id="form" autocomplete="off">
      <input id="input" type="text" maxlength="200" placeholder="Type your question…" aria-label="Type your question">
      <button class="send" id="send" type="submit" aria-label="Send question" disabled><svg aria-hidden="true"><use href="#send"/></svg></button>
    </form>
    <div class="note"><span>Automated assistant. Answers come from Kairo CORE guides.</span><span id="count"></span></div>
  </section>
</main>

<script>
const WA = "https://wa.me/263786366855";
const FALLBACK = "I don’t have that one yet. Message the team on WhatsApp and a person will help.";
const FAQ = [
  {q:"Is Kairo CORE built for my type of school?", a:"Yes. It’s designed for primary, secondary and tertiary institutions, including boarding schools.", tags:["Primary","Secondary","Tertiary","Boarding"], k:["school","type","primary","secondary","tertiary","boarding","college","academy"], rel:[1,5]},
  {q:"What does it cover?", a:"The day-to-day running of your school in one system, from admissions and fees to academics and parent communication.", tags:["Admissions","Fees","Academics","Attendance","HR & Payroll","Library"], k:["cover","include","feature","module","admission","payroll","library","exam","report card"], rel:[6,7]},
  {q:"Is our data safe?", a:"Your school’s records stay private to your school, and staff only see what their role allows.", tags:["Cloud-hosted","Role-based access","Backed up"], k:["data","safe","secure","security","privacy","private","backup"], rel:[4,3]},
  {q:"Will my team be trained?", a:"Yes. Your team is trained through hands-on sessions, video tutorials and a help centre on call. Extra training can be arranged.", tags:["Hands-on sessions","Video tutorials","Help centre"], k:["train","tutorial","onboard","learn","help","support"], rel:[5,4]},
  {q:"Can we access it from any device?", a:"Yes. Use it on a phone, tablet or computer with an internet connection.", tags:["Phone","Tablet","Computer"], k:["device","phone","mobile","tablet","laptop","computer","access","online","app"], rel:[2,5]},
  {q:"How long does setup take?", a:"Schools are up and running in days, not months. Register, set up classes, staff, fee structures and branding with our team on hand, then go live.", tags:["Register","Set up","Go live"], src:{s:"Getting started",t:"Create your school account and sign in",u:"#"}, k:["setup","set up","start","long","days","go live","register","how soon"], rel:[3,8]},
  {q:"Can parents see fees, attendance and results?", a:"Yes. Parents can follow attendance, fees and results, and you can send them announcements by email or WhatsApp.", tags:["Attendance","Fees","Results","WhatsApp alerts"], src:{s:"Announcements & communication",t:"Send announcements to staff and families",u:"#"}, k:["parent","portal","attendance","result","announce","whatsapp","family"], rel:[7,1]},
  {q:"Which payments can we record?", a:"You can record cash, transfer and EcoCash payments against invoices, print receipts and track what remains due. Billing supports multiple currencies.", tags:["Cash","Transfer","EcoCash","Receipts"], src:{s:"Finance & fees",t:"Record payments against invoices",u:"#"}, k:["pay","payment","ecocash","cash","transfer","receipt","currency","invoice"], rel:[6,5]},
  {q:"How do I book a demo?", a:"Use the “Book a personal demo” form lower on this page. It’s tailored to your school with no obligation. You can also WhatsApp or call +263 78 636 6855.", tags:["No obligation","Tailored to your school"], k:["demo","book","appointment","contact","call","email","speak"], rel:[5,7]}
];

const $ = id => document.getElementById(id);
const msgs = $("msgs"), quick = $("quick"), form = $("form"), input = $("input"), send = $("send"), jump = $("jump");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ico = n => `<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const clock = () => new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
let asked = new Set(), busy = false;

const down = () => msgs.scrollTo({top: msgs.scrollHeight});
msgs.addEventListener("scroll", () => jump.classList.toggle("on", msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight > 90));
jump.onclick = down;

function addRow(kind){
  msgs.querySelectorAll(".follow").forEach(n => n.remove());
  const r = document.createElement("div");
  r.className = "row " + kind;
  r.innerHTML = `<span class="pic ${kind === "me" ? "u" : "k"}">${ico(kind === "me" ? "user" : "kmark")}</span><div class="col"><div class="bub"></div><div class="meta">${kind === "me" ? "You" : "Kairo assistant"} · ${clock()}</div></div>`;
  msgs.appendChild(r);
  return r.querySelector(".bub");
}
const me = text => { addRow("me").textContent = text; down(); };

function typing(){
  const b = addRow("bot");
  b.classList.add("dots");
  b.innerHTML = "<i></i><i></i><i></i>";
  const row = b.closest(".row");
  down();
  return row;
}
function stream(el, text, done){
  if (reduce){ el.textContent = text; return done(); }
  const w = text.split(" "), caret = document.createElement("span");
  caret.className = "caret";
  let i = 0;
  const t = setInterval(() => {
    el.textContent = w.slice(0, ++i).join(" ");
    el.appendChild(caret);
    down();
    if (i >= w.length){ clearInterval(t); caret.remove(); done(); }
  }, 30);
}
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }

function bot(o){
  const b = addRow("bot"), p = el("p");
  b.appendChild(p);
  (o.instant ? (x, t, d) => { x.textContent = t; d(); } : stream)(p, o.text, () => {
    if (o.tags){ const u = el("ul", "tags"); o.tags.forEach(t => { const l = el("li"); l.textContent = t; u.appendChild(l); }); b.appendChild(u); }
    if (o.src){ const a = el("a", "src", ico("doc") + "<span><small></small><b></b></span>"); a.href = o.src.u; a.querySelector("small").textContent = "From the Help Centre · " + o.src.s; a.querySelector("b").textContent = o.src.t; b.appendChild(a); }
    if (o.options){ const g = el("div", "opts"); o.options.forEach(i => { const x = el("button", "opt"); x.type = "button"; x.textContent = FAQ[i].q; x.onclick = () => ask(i); g.appendChild(x); }); b.appendChild(g); }
    if (o.wa){ const a = el("a", "wa-pill", ico("wa").replace("<svg", '<svg width="16" height="16"') + "Message us on WhatsApp"); a.href = WA; a.target = "_blank"; a.rel = "noopener"; b.appendChild(a); }
    if (o.fb){
      const f = el("div", "fb", `<button type="button" aria-label="Helpful">${ico("up")}</button><button type="button" aria-label="Not helpful">${ico("down")}</button>`);
      f.onclick = e => { if (e.target.closest("button")) f.textContent = "Thanks for the feedback"; };
      b.appendChild(f);
    }
    if (o.follow && o.follow.length){
      const g = el("div", "follow");
      o.follow.forEach(i => { const c = el("button", "chip"); c.type = "button"; c.textContent = FAQ[i].q; c.onclick = () => ask(i); g.appendChild(c); });
      msgs.appendChild(g);
    }
    busy = false;
    down();
  });
}

function chips(){
  quick.innerHTML = "";
  const left = FAQ.map((f, i) => i).filter(i => !asked.has(i));
  const label = el("p", "label");
  label.textContent = left.length ? "Suggested questions" : "That’s every suggested question. Type your own below.";
  quick.appendChild(label);
  if (!left.length) return;
  const rail = el("div", "rail");
  left.forEach(i => { const c = el("button", "chip"); c.type = "button"; c.textContent = FAQ[i].q; c.onclick = () => ask(i); rail.appendChild(c); });
  quick.appendChild(rail);
}

function say(userText, build){
  if (busy) return;
  busy = true;
  me(userText);
  const t = typing();
  setTimeout(() => { t.remove(); build(); }, reduce ? 0 : 750);
}
function ask(i, text){
  if (busy) return;
  asked.add(i);
  chips();
  say(text || FAQ[i].q, () => bot({text: FAQ[i].a, tags: FAQ[i].tags, src: FAQ[i].src, follow: FAQ[i].rel.filter(r => !asked.has(r)), fb: true}));
}

form.onsubmit = e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v || busy) return;
  input.value = ""; sync();
  const l = v.toLowerCase();
  if (/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(l)) return say(v, () => bot({text:"Hello! Ask me about Kairo CORE, or tap one of the suggested questions."}));
  if (/\b(thanks|thank you|cheers)\b/.test(l)) return say(v, () => bot({text:"You’re welcome. Anything else you’d like to know?"}));
  if (/\b(bot|ai|human|real person|robot)\b/.test(l)) return say(v, () => bot({text:"I’m an automated assistant that answers from Kairo CORE’s guides. A person is one WhatsApp message away.", wa:true}));
  const scored = FAQ.map((f, i) => ({i, s: f.k.filter(w => l.includes(w)).length})).filter(x => x.s).sort((a, b) => b.s - a.s);
  if (scored.length && scored[0].s >= 2) return ask(scored[0].i, v);
  if (scored.length) return say(v, () => bot({text:"Did you mean one of these?", options: scored.slice(0, 3).map(x => x.i)}));
  say(v, () => bot({text: FALLBACK, wa:true}));
};
function sync(){
  send.disabled = !input.value.trim();
  $("count").textContent = input.value.length >= 150 ? input.value.length + "/200" : "";
}
input.addEventListener("input", sync);

function start(){
  msgs.innerHTML = '<div class="day">Today</div>';
  asked = new Set([0]);
  busy = false;
  bot({instant:true, text:"Hi, I’m the Kairo assistant. Tap a question below or type your own."});
  me(FAQ[0].q);
  bot({instant:true, text: FAQ[0].a, tags: FAQ[0].tags, follow: FAQ[0].rel, fb: true});
  chips();
}
$("reset").onclick = start;
start();
</script>
</body>
