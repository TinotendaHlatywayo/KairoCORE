<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kairo CORE FAQ: conversational concept</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f8fc;--surface:#ffffff;--ink:#1b2440;--muted:#5d6785;--line:#e4e8f2;
  --accent:#f2553d;--accent-ink:#ffffff;--bot:#eef1f8;--shadow:rgba(27,36,64,.28);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1325;--surface:#161d35;--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
    --accent:#ff6a52;--bot:#202947;--shadow:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1325;--surface:#161d35;--ink:#eef1fb;--muted:#9ba5c6;--line:#27304d;
  --accent:#ff6a52;--bot:#202947;--shadow:rgba(0,0,0,.6);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:80px 24px;display:grid;grid-template-columns:5fr 7fr;gap:64px;align-items:center}
h1{font-size:clamp(34px,5vw,56px);line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:0 0 18px}
.lead{color:var(--muted);font-size:17px;max-width:36ch;margin:0}
.wa{display:inline-block;margin-top:28px;padding:13px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none;transition:transform .15s}
.wa:hover{transform:translateY(-2px)}
.wa:focus-visible,.chip:focus-visible,.reset:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.chat{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 40px 70px -40px var(--shadow);overflow:hidden}
.head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:18px}
.head b{display:block;font-size:15px;line-height:1.2}
.head small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px}
.live{width:7px;height:7px;border-radius:50%;background:#2fbf71}
.reset{margin-left:auto;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.reset:hover{color:var(--ink);border-color:var(--ink)}

.msgs{height:370px;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:84%;padding:12px 16px;border-radius:20px;font-size:15px;animation:in .3s ease both}
.bot{background:var(--bot);border-bottom-left-radius:6px;align-self:flex-start}
.me{background:var(--accent);color:var(--accent-ink);font-weight:600;border-bottom-right-radius:6px;align-self:flex-end}
.typing{display:flex;gap:5px;padding:16px 18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.quick{display:flex;flex-wrap:wrap;gap:8px;padding:16px 20px 20px;border-top:1px solid var(--line)}
.chip{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer;transition:border-color .15s,color .15s,transform .15s}
.chip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.done{margin:0;font-size:14px;color:var(--muted)}
.done a{color:var(--accent);font-weight:700}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:36px;padding:48px 18px}
  .msgs{height:340px}
  .m{max-width:92%}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  .msgs{scroll-behavior:auto}
}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h1>Questions school leaders ask us</h1>
    <p class="lead">Tap a question and get the answer straight away. Can’t find yours? Message us on WhatsApp.</p>
    <a class="wa" href="https://wa.me/" target="_blank" rel="noopener">Message us on WhatsApp</a>
  </div>

  <section class="chat" aria-label="Frequently asked questions">
    <div class="head">
      <div class="avatar" aria-hidden="true">K</div>
      <div><b>Kairo team</b><small><span class="live"></span>Answers instantly</small></div>
      <button class="reset" id="reset" type="button">Start over</button>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="quick" id="quick"></div>
  </section>
</main>

<script>
const FAQ = [
  {q:"Is Kairo CORE built for my type of school?",
   a:"Yes. It’s designed for primary, secondary and tertiary institutions, including boarding schools."},
  {q:"What does it cover?",
   a:"The day-to-day running of your school in one system, from admissions and fees to academics and parent communication. Replace this with your real module list."},
  {q:"Is our data safe?",
   a:"Your school’s records stay private to your school, and staff only see what their role allows. Replace this with your real security details."},
  {q:"Will my team be trained?",
   a:"Yes. Your team is trained through hands-on sessions, video tutorials and a help centre on call. Extra training can be arranged."},
  {q:"Can we access it from any device?",
   a:"Yes. Use it on a phone, tablet or computer with an internet connection. Replace this if your setup differs."}
];

const msgs = document.getElementById("msgs");
const quick = document.getElementById("quick");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let asked = new Set(), busy = false;

function add(cls, text){
  const d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function chips(){
  quick.innerHTML = "";
  const left = FAQ.map((f, i) => i).filter(i => !asked.has(i));
  left.forEach(i => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = FAQ[i].q;
    b.onclick = () => ask(i);
    quick.appendChild(b);
  });
  if (!left.length){
    quick.innerHTML = '<p class="done">That’s every common question. Still curious? <a href="https://wa.me/" target="_blank" rel="noopener">Message us on WhatsApp</a>.</p>';
  }
}

function ask(i){
  if (busy) return;
  busy = true;
  asked.add(i);
  chips();
  add("me", FAQ[i].q);
  const t = document.createElement("div");
  t.className = "m bot typing";
  t.innerHTML = "<i></i><i></i><i></i>";
  msgs.appendChild(t);
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(() => { t.remove(); add("bot", FAQ[i].a); busy = false; }, reduce ? 0 : 900);
}

function start(){
  msgs.innerHTML = "";
  asked = new Set([0]);
  busy = false;
  add("bot", "Hi, I’m here to answer the questions school leaders ask most. Tap one below.");
  add("me", FAQ[0].q);
  add("bot", FAQ[0].a);
  chips();
}

document.getElementById("reset").onclick = start;
start();
</script>
</body>
</html>
