# =====================================================================
# SchoolCore - Multi-Tenant Virtual Hosts (HTTPS)
#
# Installed to /opt/lampp/etc/extra/httpd-vhosts.conf
#
# * Port 80   -> Permanent 301 redirect to HTTPS (preserves subdomain).
# * Port 443  -> Serves the Laravel app for lvh.me and *.lvh.me with a
#                self-signed certificate valid for 10 years.
#
# In production replace the self-signed certificate with a Let's Encrypt
# certificate and change "lvh.me" to your real apex domain.
# =====================================================================

# ---- HTTP -> HTTPS redirect (all base + tenant subdomains) ----
<VirtualHost *:80>
    ServerName lvh.me
    ServerAlias *.lvh.me

    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog "logs/schoolcore-http-error.log"
    CustomLog "logs/schoolcore-http-access.log" combined
</VirtualHost>

# ---- HTTPS vhost (Laravel entry point) ----
<VirtualHost *:443>
    ServerName lvh.me
    ServerAlias *.lvh.me

    DocumentRoot "/opt/lampp/htdocs/SchoolManagementSystem/schoolcore/public"

    <Directory "/opt/lampp/htdocs/SchoolManagementSystem/schoolcore/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile "/opt/lampp/etc/ssl.crt/lvh.me.crt"
    SSLCertificateKeyFile "/opt/lampp/etc/ssl.key/lvh.me.key"
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder off

    ErrorLog "logs/schoolcore-ssl-error.log"
    CustomLog "logs/schoolcore-ssl-access.log" combined
</VirtualHost>
