# Kairo CORE — Nginx server block (HTTPS with Let's Encrypt wildcard)
# Place at /etc/nginx/sites-available/kairocore
# Redirects HTTP -> HTTPS and serves the wildcard cert for kairocore.me / *.kairocore.me

server {
    listen 80;
    listen [::]:80;
    server_name kairocore.me *.kairocore.me;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kairocore.me *.kairocore.me;

    # Let's Encrypt wildcard certificate (note: NO trailing slash)
    ssl_certificate     /etc/letsencrypt/live/kairocore.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairocore.me/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/kairocore.me/chain.pem;

    # Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/kairocore/public;
    index index.php;

    charset utf-8;
    # At or above PHP's post_max_size (540M) so an oversized body is rejected
    # by PHP with a real validation message instead of a bare nginx 413 page.
    client_max_body_size 540M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # Let's Encrypt challenge path (must be reachable over HTTP for the http-01 fallback)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Block hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
