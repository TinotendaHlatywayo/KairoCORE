# Kairo CORE — Nginx server block
# Supports wildcard subdomains for multi-tenant (*.kairocore.com)
# Place at /etc/nginx/sites-available/kairocore

server {
    listen 80;
    server_name kairocore.com *.kairocore.com;

    root /var/www/kairocore/public;
    index index.php;

    charset utf-8;
    # At or above PHP's post_max_size (540M) so an oversized body is rejected
    # by PHP with a real validation message instead of a bare nginx 413 page.
    client_max_body_size 540M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffering off;
    }

    # Block hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
