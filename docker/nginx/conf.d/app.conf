# =============================================================================
# Nginx site configuration for the Laravel application.
#
# - Root points at Laravel's public directory.
# - Non-existent paths are rewritten to index.php (front controller).
# - .php requests are forwarded to the "app" service (php-fpm) on port 9000.
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    charset utf-8;

    client_max_body_size 300M;
    client_body_timeout 120s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Front controller: route all requests that do not match a real file/dir
    # through the Laravel bootstrap (public/index.php).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Long-term caching for static assets & media
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Short-circuit static favicon / robots.txt requests.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Send 404s through Laravel for a proper error page.
    error_page 404 /index.php;

    # Pass PHP requests to php-fpm running in the "app" container.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
    }

    # Deny access to hidden files (e.g. .env) except the well-known directory.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
