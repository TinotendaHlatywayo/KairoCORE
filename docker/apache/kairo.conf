ServerName localhost
ServerTokens Prod
ServerSignature Off

# Cap workers so a traffic spike can't exceed the container memory limit
# (~40-60 MB per PHP worker; the web container is limited to 1 GB).
<IfModule mpm_prefork_module>
    StartServers            4
    MinSpareServers         2
    MaxSpareServers         6
    MaxRequestWorkers      16
    MaxConnectionsPerChild 500
</IfModule>
