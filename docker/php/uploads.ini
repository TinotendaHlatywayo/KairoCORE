; Upload ceiling for the web tier — MUST sort after zz-production.ini
; (which asks for only 20M/25M) so that this file is the one that wins.
;
; "Restore from a file" no longer POSTs the whole archive at once: the
; browser sends 10 MB pieces (config/uploads.php), so the numbers below are a
; safety net well above any single request the app makes today, and they also
; cover ordinary large single-shot uploads (Livewire temp files, photos).
;
; post_max_size must exceed upload_max_filesize (form fields need headroom),
; and max_input_time must cover receiving a body this size over a slow link —
; without it PHP falls back to max_execution_time and the transfer is cut
; part-way through. max_execution_time and memory_limit are lifted because a
; 500 MB archive is checksummed and opened as a ZIP inside one request.
upload_max_filesize = 512M
post_max_size = 520M
max_file_uploads = 50
max_input_time = 900
max_execution_time = 600
memory_limit = 1024M
