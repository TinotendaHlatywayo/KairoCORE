; Upload ceiling for the web tier — MUST sort after zz-production.ini
; (which asks for only 20M/25M) so that this file is the one that wins.
;
; Recovery archives (database + every uploaded file) run well past 100 MB, so
; this has to stay comfortably above the largest archive anyone is likely to
; pick. The number actually quoted back to the user is the smallest of this,
; Livewire's temporary_file_upload rules and UPLOAD_MAX_MB (config/uploads.php),
; so production pins a lower ceiling there for the CDN in front of PHP.
;
; post_max_size must exceed upload_max_filesize (form fields need headroom),
; and max_input_time must cover receiving a body this size over a slow link —
; without it PHP falls back to max_execution_time (120s) and the transfer is
; cut part-way through.
upload_max_filesize = 512M
post_max_size = 540M
max_file_uploads = 50
max_input_time = 900
